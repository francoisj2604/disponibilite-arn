<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disponibilité · M. François</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;700&amp;family=Barlow+Semi+Condensed:wght@600&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap"><link rel="stylesheet" href="style.css?v=aide-numerique"><script type="module" src="display.js?v=aide-numerique"></script></head>
<body class="display">
<video class="display-background" muted autoplay loop playsinline preload="auto" aria-hidden="true" tabindex="-1">
  <source src="fond-ipad.mp4" type="video/mp4">
</video>
<main class="board">
<header><div><p class="eyebrow">Aide numérique · Local W</p><p class="name">M. François</p></div><div class="board-clock"><span id="date"></span><time id="clock"></time></div></header>
<section class="hero" id="hero" data-mode="unknown" aria-live="polite"><img id="memoji" alt="" width="320" height="320" hidden><div class="status-copy"><span class="indicator" aria-hidden="true"></span><h1 id="status">Chargement…</h1><p id="guest" class="guest" hidden></p><p id="message" class="temporary-message" hidden></p><div class="status-detail"><p id="until" hidden></p><p id="detail" hidden></p></div></div></section>
<footer><span id="connection"></span></footer>
<details id="displaySettings" hidden><summary>Accès aux noms des réservations</summary>
<form id="displayAccess"><label>Clé de l’iPad <input id="displayKey" type="password" required autocomplete="off"></label>
<button>Activer</button><button type="button" class="secondary" id="forget">Oublier la clé</button></form></details>
</main></body></html>
